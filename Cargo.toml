[package]
name = "virtuoso-cli"
version = "1.2.0"
edition = "2021"
description = "CLI tool to control Cadence Virtuoso from anywhere, locally or remotely"
license = "MIT"
repository = "https://github.com/deanyou/virtuoso-cli"
homepage = "https://github.com/deanyou/virtuoso-cli"
keywords = ["eda", "cadence", "virtuoso", "analog-ic", "spectre"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".cadence/", ".claude/", ".pensieve/", "plots/", "docs/plans/", "sim/", "process_data/", "CLAUDE.md"]

[[bin]]
name = "vcli"
path = "src/main.rs"

[[bin]]
name = "vtui"
path = "src/vtui.rs"

[[bin]]
name = "virtuoso-daemon"
path = "src/daemon/main.rs"
required-features = ["daemon"]

[features]
daemon = []
# Native (russh-based) SSH backend. Enabling this feature compiles the pure-Rust
# native SSH client; selecting VB_SSH_BACKEND=native on a build *without* this
# feature returns a structured UnsupportedBackend (see src/transport/backend.rs).
# This is step 3 of the native-transport delivery sequence: a single-hop direct
# connection with host-key verification and public-key auth. Connection pooling,
# SOCKS5, jump-host routing, and the RAMIC forward daemon are later increments.
native-ssh = ["russh", "russh-sftp"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
glob = "0.3"
dotenvy = "0.15"
include_dir = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.23"
tempfile = "3"
shlex = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
lazy_static = "1"
libc = "0.2"
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "io-util"] }
regex = "1"
toml = "0.8"
num_cpus = "1"
russh = { version = "0.63.1", optional = true }
russh-sftp = { version = "2", optional = true }

[dev-dependencies]
# `#[serial]` marks a test as needing exclusive access to the process-global
# environment (and any other state keyed to it). Cargo runs tests in parallel
# by default; without this, two tests that read or write the same env var race
# each other, even though writers hold the legacy `crate::test_env` lock. The
# lock only serializes *writers*, so an unlocked reader can still observe a
# half-written env while another test holds it. `#[serial]` covers both sides
# with one mechanism.
serial_test = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
