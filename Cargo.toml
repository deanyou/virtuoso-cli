[package]
name = "virtuoso-cli"
version = "1.3.6"
edition = "2021"
description = "CLI tool to control Cadence Virtuoso from anywhere, locally or remotely"
license = "MIT"
repository = "https://github.com/deanyou/virtuoso-cli"
homepage = "https://github.com/deanyou/virtuoso-cli"
keywords = ["eda", "cadence", "virtuoso", "analog-ic", "spectre"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    ".agents/",
    ".cadence/",
    ".claude/",
    ".codex/",
    ".evoontology/",
    ".pensieve/",
    ".ua/",
    ".workbuddy/",
    ".trash-*/",
    "plots/",
    "docs/plans/",
    "sim/",
    "process_data/",
    "SKILL-TREE-SYNC-REPORT.md",
    "CLAUDE.md",
]

[[bin]]
name = "vcli"
path = "src/main.rs"

[[bin]]
name = "vtui"
path = "src/vtui.rs"

[[bin]]
name = "virtuoso-daemon"
path = "src/daemon/main.rs"
required-features = ["daemon"]

[features]
daemon = []
native-ssh = ["russh", "russh-sftp"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
glob = "0.3"
include_dir = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
tempfile = "3"
shlex = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "7"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
lazy_static = "1"
libc = "0.2"
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "io-util", "net", "sync"] }
regex = "1"
toml = "1.1"
num_cpus = "1"
russh = { version = "0.65.0", optional = true }
russh-sftp = { version = "3", optional = true }

[dev-dependencies]
serial_test = "4"
rand = { version = "0.10", features = ["thread_rng"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
