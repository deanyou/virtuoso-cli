    <path class="wire" d="M160 230.4H352V166.4H360"/>
    <path class="wire" d="M214.4 6.4V44H170"/>
    <path class="wire" d="M170 44V60"/>
    <path class="wire" d="M170 88V198.4"/>
    <path class="wire" d="M200 44V60"/>
    <path class="wire" d="M200 88V230.4"/>
    <path class="wire" d="M404 134.4H438.4"/>
    <path class="wire" d="M404 166.4H438.4"/>
    <path class="wire" d="M110 252V262"/>
    <path class="wire" d="M110 272V276"/>
    <path class="ctrl" d="M6.4 134.4H52V72H207"/>
    <path class="ctrl" d="M72 258H100"/>
    <path class="ctrl" d="M6.4 166.4H270V176"/>
  </g>

