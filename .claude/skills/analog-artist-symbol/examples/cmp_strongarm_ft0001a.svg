<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="561.6" height="294.4" viewBox="0 0 561.6 294.4" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">CMP_STRONGARM</title>
  <desc id="svg-desc">Functional symbol of the strong-arm (latch-type) comparator cell cmp_strongarm, drawn on the pin frame that FT0001A_SH/cmp_strongarm/symbol already uses, so the parent testbench cmp_strongarm_tb keeps its connections. VIP and VIN are the differential inputs, CLK the evaluation clock, CLKB the complementary clock for the latch source, VDD and VSS the supplies, and Q and QB the differential outputs. VIP and VIN drive an NMOS differential pair with a CLK-controlled tail switch; CLK also gates the PMOS precharge switches that pull internal nodes X and Y to VDD. CLKB enables the VDD switch for the latch source. X and Y feed the cross-coupled regenerative latch and then inverting output buffers. With the NMOS input pair, Q is high while VIP exceeds VIN, and QB is high while VIN exceeds VIP. The pin frame is the one already in use: VIP, VIN, CLKB and CLK on the left edge, Q and QB on the right edge, VDD and VSS on the top edge. The tail switch gate is annotated with the CLK label rather than wired across the signal paths. Crossed feedback paths are not joined at the crossing. No buses are used.</desc>
  <metadata>{"cell":"cmp_strongarm","library":"FT0001A_SH","frame":"existing FT0001A_SH/cmp_strongarm pin frame","ports":[{"name":"VIP","direction":"input","side":"left"},{"name":"VIN","direction":"input","side":"left"},{"name":"CLKB","direction":"input","side":"left"},{"name":"CLK","direction":"input","side":"left"},{"name":"VDD","direction":"inputOutput","side":"top"},{"name":"VSS","direction":"inputOutput","side":"top"},{"name":"Q","direction":"output","side":"right"},{"name":"QB","direction":"output","side":"right"}],"terminal_order":["Q","QB","VDD","VSS","CLK","CLKB","VIN","VIP"],"internal":"NMOS input pair with CLK tail -> nodes X,Y -> cross-coupled regenerative latch -> inverting output buffers","control":{"CLK":"PMOS precharge switches on X,Y and NMOS tail switch; active-high evaluation","CLKB":"VDD switch for the latch source"},"nodes":{"X":"drain node of the VIP branch","Y":"drain node of the VIN branch"},"polarity":"Q high while VIP exceeds VIN; QB high while VIN exceeds VIP"}</metadata>
  <defs>
    <style>
