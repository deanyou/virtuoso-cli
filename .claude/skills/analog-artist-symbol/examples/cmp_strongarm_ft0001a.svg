      .title { font-size: 19px; font-weight: 600; fill: #287740; }
      .port-label { fill: #c53e32; font-size: 16px; }
      .label { fill: #216038; font-size: 16px; }
      .small { font-size: 13px; }
      .wire { fill: none; stroke: #425d4a; stroke-width: 1.8; stroke-linecap: square; stroke-linejoin: round; }
      .shape { fill: none; stroke: #287740; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .gate { fill: #ffffff; stroke: #287740; stroke-width: 1.8; stroke-linejoin: round; }
      .contact { fill: #ffffff; stroke: #425d4a; stroke-width: 1.5; }
      .dot { fill: #425d4a; }
      .pin { fill: #df4638; }
      .module { fill: none; stroke: #287740; stroke-width: 1.4; stroke-linejoin: miter; }
      .ctrl { fill: none; stroke: #69846f; stroke-width: 1.2; stroke-dasharray: 4 3; }
    </style>
  </defs>

