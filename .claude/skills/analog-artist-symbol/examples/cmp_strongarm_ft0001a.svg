    <circle class="contact" cx="200" cy="88" r="3"/>
  </g>
  <g id="regenerative-feedback">
    <path class="wire" d="M330 198.4V204L280 216V230.4"/>
    <path class="wire" d="M330 230.4V224L270 208V198.4"/>
