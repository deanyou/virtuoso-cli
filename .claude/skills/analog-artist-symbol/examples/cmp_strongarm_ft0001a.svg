    <text id="label-pair" class="label small" x="110" y="194" text-anchor="middle">NMOS PAIR</text>
    <text id="label-gm" class="label" x="110" y="246" text-anchor="middle">gm</text>
    <text id="label-precharge" class="label" x="160" y="94" text-anchor="end">PRECHARGE</text>
