name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo clippy --features daemon -- -D warnings
      - run: cargo clippy --features native-ssh -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - run: cargo build --features daemon

  helper-tests:
    # The vendored X11 helper (resources/x11_dismiss_dialog.py) is uploaded to
    # the remote host by src/transport/x11.rs, and its argv/env contract is
    # half of the fix for the wrong-display bug — the Rust tests assert the
    # command we build, these assert how the helper reads it. Without this job
    # the helper side of that contract was only ever checked locally.
    name: X11 helper tests
    # ubuntu-24.04, not ubuntu-latest: `ubuntu-latest` has moved on to a
    # release whose setup-python manifest no longer carries 3.9, and 3.9 is
    # the oldest interpreter this suite supports. skill-tests.yml pins the
    # same image for the same reason.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # 3.9 = oldest supported system python (see skill-tests.yml).
          python-version: "3.9"
      - name: Run the helper's unit tests
        run: |
          set -euo pipefail
          out="$(python3 -m unittest discover -s tests/docs -p 'test_*.py' 2>&1)" || {
            printf '%s\n' "$out"
            exit 1
          }
          printf '%s\n' "$out"
          # unittest exits 0 when it discovers no tests at all, which would
          # turn this job green while verifying nothing.
          printf '%s\n' "$out" | grep -qE '^Ran [1-9][0-9]* tests?' || {
            echo "::error::no helper test was discovered"
            exit 1
          }

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Pinned (no moving target), --locked for reproducibility.
      # RUSTSEC-2023-0071 (rsa 0.10.0-rc.18, Marvin) is ignored: rsa is only
      # reachable via ssh-key -> russh under the `native-ssh` feature; the
      # default build does not link rsa, upstream has no fixed release, and
      # Marvin needs an RSA private-key decryption oracle we never expose.
      # See audit.toml for the full rationale.
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --ignore RUSTSEC-2023-0071

  windows-native-ssh:
    name: Windows native-ssh build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --features native-ssh --all-targets
      - run: cargo test --features native-ssh --all-targets
      - run: cargo clippy --features native-ssh --all-targets -- -D warnings
