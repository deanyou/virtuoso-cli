name: Integration Matrix

# Step 7 of the native-transport plan: a real cross-platform net.
# Linux / macOS / Windows each build and test BOTH the default backend and the
# `native-ssh` feature, so a Windows-only native build break (the highest-risk
# item) surfaces here instead of at release time. fail-fast is off so one OS
# does not mask another.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  matrix:
    name: ${{ matrix.os }} / ${{ matrix.features }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features: [default, native-ssh]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build ${{ matrix.features != 'default' && format('--features {0}', matrix.features) || '' }}
      - name: Test
        run: cargo test ${{ matrix.features != 'default' && format('--features {0}', matrix.features) || '' }}
